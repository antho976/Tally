name: Record screenshot goldens and Room schema

# Re-records app/src/test/screenshots on a branch and commits them back. Run it deliberately when a
# screen changed on purpose, then LOOK at the diff in the commit before trusting the new goldens:
# a changed golden is a question, not a chore.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true
      - name: Install the Android platform
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null 2>&1 || true
          "$sdkmanager" "platforms;android-37.0" > /dev/null
      - name: Record
        run: ./gradlew :app:recordRoborazziDebug
      - name: Commit the goldens
        run: |
          git config user.name "margin-ci"
          git config user.email "margin-ci@users.noreply.github.com"
          git add app/src/test/screenshots app/schemas
          if git diff --cached --quiet; then echo "Goldens unchanged."; exit 0; fi
          git commit -m "Record screenshot goldens"
          git push
